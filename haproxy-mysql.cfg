# Example HAProxy frontends for a 3-node local MySQL Patroni layout
# (default ports from patroni_mysql_init: MySQL 3306-3308, REST 8008-8010).
#
# Prefer the haproxy.cfg written into the generated deploy directory —
# that file always matches your --mysql-port-base / --api-port-base.
#
# Usage:
#   haproxy -f haproxy-mysql.cfg -db
#   mysql -h 127.0.0.1 -P 5000 -u root          # primary
#   mysql -h 127.0.0.1 -P 5001 -u root -e '...' # replicas

global
    maxconn 100

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

listen mysql_primary
    bind *:5000
    option httpchk HEAD /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server mysql0 127.0.0.1:3306 maxconn 100 check port 8008
    server mysql1 127.0.0.1:3307 maxconn 100 check port 8009
    server mysql2 127.0.0.1:3308 maxconn 100 check port 8010

listen mysql_replicas
    bind *:5001
    balance roundrobin
    option httpchk HEAD /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server mysql0 127.0.0.1:3306 maxconn 100 check port 8008
    server mysql1 127.0.0.1:3307 maxconn 100 check port 8009
    server mysql2 127.0.0.1:3308 maxconn 100 check port 8010
